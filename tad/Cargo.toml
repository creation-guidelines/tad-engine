[package]
name = "tad"
version = "0.1.0"
edition = "2021"
description = "A transparent database of text files in git: tables declared as data, every row checked"
license = "MIT"

[[bin]]
name = "tad"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = "0.59"
toml = "0.8"
