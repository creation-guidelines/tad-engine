name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: simple
      - name: Tag dist at the same version
        # dist mirrors engine/ (see dist.yml) and is already current by the time a release lands,
        # since release-please can only bump a version from a feat/fix commit already on main, and
        # that same push re-synced dist. Tagging dist's current tip under the release's own tag
        # gives consumers a pinned, engine-only ref to subrepo-clone/pull instead of the moving
        # `dist` branch - two `gh api` calls, no checkout needed.
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          sha=$(gh api "repos/${{ github.repository }}/git/refs/heads/dist" --jq .object.sha)
          gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$TAG" -f sha="$sha"
          echo "Tagged dist@$sha as $TAG"
