# tad, the Rust tool, released: a tag tad-v* (set by land --tag, only on merged code) makes a release,
# and the package conveyor builds its binaries with signed provenance. Called, not copied.
name: tad release
on:
  push:
    tags: ["tad-v*"]
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: The release, if it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "tad, the Rust tool: tables declared as data, every row checked, canonical form, checked edits, documents rendered."
  binaries:
    needs: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: linux-package-distribution-oco/conveyor/.github/workflows/binaries.yml@v1
    with:
      tag: ${{ github.ref_name }}
      declaration: packaging/conveyor.toml
