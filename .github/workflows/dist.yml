name: dist
on:
  push:
    branches: [main]
    paths: ["engine/**"]
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Publish engine/ as the dist branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git subtree split --prefix=engine -b dist-new
          git push origin dist-new:dist --force
          git branch -D dist-new
