name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r engine/requirements.txt -r engine/requirements-test.txt
      - run: python3 engine/tests/test_dc.py
      - run: python3 engine/tests/test_render.py
